models:
  - name: restaurants__turnover_ordered
    columns:
      - name: restaurant_id
      - name: name
        tests:
          - unique
      - name: address
      - name: nb_employees
      - name: open_on_sunday
      - name: total_turnover
        tests:
          - is_positive

exposures:
  - name: top_restaurants_by_turnover_export
    description: "Top restaurants by turnover exported in a bucket"
    type: application
    owner:
      name: llenoir
    